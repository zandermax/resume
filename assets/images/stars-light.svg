<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="stars" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect fill="#ffffff" width="200" height="200"/>
      <circle cx="20" cy="30" r="2" fill="#ffff00">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="80" cy="70" r="1.5" fill="#ff00ff">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="40" r="2" fill="#00ffff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="45" cy="120" r="1.5" fill="#ffff00">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="170" cy="150" r="2" fill="#ff00ff">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="110" cy="180" r="1.5" fill="#00ffff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="90" r="1.5" fill="#ffff00">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="130" cy="110" r="2" fill="#ff00ff">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/>
      </circle>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#stars)"/>
</svg>
